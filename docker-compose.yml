version: '3.8'

services:
  aflac-assist:
    build: .
    ports:
      - "8000:8000"
      - "11434:11434"
    volumes:
      - ./data:/app/data
      - ./chroma:/app/chroma
    environment:
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - OLLAMA_MODEL=mistral
    restart: unless-stopped
