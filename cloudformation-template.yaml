# AWS CloudFormation Template for Aflac Assist Chat
AWSTemplateFormatVersion: '2010-09-09'
Description: 'Aflac Assist Chat - RAG Chatbot with Ollama'

Parameters:
  KeyName:
    Description: EC2 Key Pair for SSH access
    Type: AWS::EC2::KeyPair::KeyName
  
  InstanceType:
    Description: EC2 instance type (t3.large recommended for cost efficiency)
    Type: String
    Default: t3.large
    AllowedValues:
      - t3.large
      - t3.xlarge
      - t3.2xlarge
      - g4dn.xlarge
      - g4dn.2xlarge

Resources:
  # Security Group
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Aflac Assist Chat
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0  # SSH - Restrict to your IP in production
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: 0.0.0.0/0  # FastAPI
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0  # HTTP
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0  # HTTPS

  # EC2 Instance
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      ImageId: ami-0c55b159cbfafe1f0  # Ubuntu 22.04 LTS (update for your region)
      SecurityGroups:
        - !Ref SecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 100
            VolumeType: gp3
            DeleteOnTermination: false
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          curl -o /tmp/setup.sh https://raw.githubusercontent.com/somanshushekhar/rag-tutorial-v2/main/ec2-user-data.sh
          chmod +x /tmp/setup.sh
          /tmp/setup.sh
      Tags:
        - Key: Name
          Value: Aflac-Assist-Chat

Outputs:
  PublicIP:
    Description: Public IP address of the instance
    Value: !GetAtt EC2Instance.PublicIp
  
  ApplicationURL:
    Description: URL to access the application
    Value: !Sub 'http://${EC2Instance.PublicIp}:8000'
